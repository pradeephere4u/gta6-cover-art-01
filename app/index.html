<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dusk Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <section class="panel" aria-label="Cover controls">
    <h1>Neon Dusk <span>Cover Studio</span></h1>
    <p class="lede">Your photo and a caption, made into GTA-style cover art. Load photos, pick a layout and a grade, then export a PNG to share.</p>

    <h2>Size</h2>
    <div class="row" role="group" aria-label="Export size">
      <button type="button" data-group="size" data-value="square">Square 1080&times;1080</button>
      <button type="button" data-group="size" data-value="portrait">Portrait 1080&times;1350</button>
      <button type="button" data-group="size" data-value="wide">Wide 1920&times;1080</button>
    </div>

    <h2>Layout</h2>
    <div class="row" role="group" aria-label="Panel layout">
      <button type="button" data-group="layout" data-value="hero-left">Hero left</button>
      <button type="button" data-group="layout" data-value="hero-right">Hero right</button>
      <button type="button" data-group="layout" data-value="duo">Duo</button>
    </div>

    <h2>Grade</h2>
    <div class="row" role="group" aria-label="Colour grade">
      <button type="button" data-group="grade" data-value="sunset">Sunset</button>
      <button type="button" data-group="grade" data-value="neon">Neon</button>
      <button type="button" data-group="grade" data-value="dusk">Dusk</button>
    </div>

    <h2>Photos</h2>
    <label class="fill-all">One photo fills every panel
      <input id="fill-all" type="file" accept="image/*">
    </label>
    <div class="slot" data-slot="1">
      <h3>Panel 1 &middot; hero</h3>
      <label>Your photo <input type="file" accept="image/*"></label>
      <button type="button" class="sample-btn">Use sample photo</button>
      <label>Zoom <input class="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Move left&ndash;right <input class="panx" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
      <label>Move up&ndash;down <input class="pany" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
    </div>
    <div class="slot" data-slot="2">
      <h3>Panel 2</h3>
      <label>Your photo <input type="file" accept="image/*"></label>
      <button type="button" class="sample-btn">Use sample photo</button>
      <label>Zoom <input class="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Move left&ndash;right <input class="panx" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
      <label>Move up&ndash;down <input class="pany" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
    </div>
    <div class="slot" data-slot="3">
      <h3>Panel 3</h3>
      <label>Your photo <input type="file" accept="image/*"></label>
      <button type="button" class="sample-btn">Use sample photo</button>
      <label>Zoom <input class="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Move left&ndash;right <input class="panx" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
      <label>Move up&ndash;down <input class="pany" type="range" min="-0.6" max="0.6" step="0.05" value="0"></label>
    </div>

    <h2>Words</h2>
    <label>Caption <input id="caption" type="text" maxlength="28" value="Vice Nights"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="48" value="A Leonida story"></label>
    <label>Caption size <input id="caption-scale" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status">Pick a photo to begin.</p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
